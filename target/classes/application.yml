# Común para todos los entornos
spring:
  application:
    name: polleria-caporal
  profiles:
    # Sin PostgreSQL: deja `dev` (usa H2 en carpeta ./data/).
    # Con PostgreSQL: cambia a `postgres` y arranca cuando el servidor esté en marcha.
    active: dev
  threads:
    virtual:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html

server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  shutdown: graceful

logging:
  level:
    root: INFO
    "[com.polleriacaporal]": DEBUG
    "[org.hibernate.SQL]": DEBUG

---
# Perfil local sin instalar servidor.
# H2 en MEMORIA evita bloqueos por OneDrive/sincronización en carpetas del Escritorio.
# Consola H2: misma URL jdbc:h2:mem:polleriacaporal (usuario sa, sin contraseña).
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:polleriacaporal;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

---
# Producción/desarrollo con PostgreSQL (tablas gestionadas por Hibernate con ddl-auto: update arriba)
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/polleria_caporal
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
