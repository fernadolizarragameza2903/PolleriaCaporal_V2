<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Gestionar Productos - Pollería Caporal</title>
</head>
<body>
    <th:block layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-0">
                    <i class="fas fa-box"></i> Gestión de Productos
                </h2>
                <p class="text-muted mb-0">Administra el catálogo, los precios y el stock de manera rápida.</p>
            </div>
            <button class="btn btn-primary shadow-sm"
                    type="button"
                    data-bs-toggle="modal"
                    data-bs-target="#productoModal">
                <i class="fas fa-plus"></i> Nuevo Producto
            </button>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Nombre</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(productos)}">
                                <td colspan="5" class="text-center text-muted py-4">
                                    <i class="fas fa-inbox"></i> No hay productos registrados
                                </td>
                            </tr>
                            <tr th:each="producto : ${productos}">
                                <td th:text="${producto.nombre}">Nombre</td>
                                <td th:text="${producto.categoria}">Categoría</td>
                                <td th:text="${'S/ ' + #numbers.formatDecimal(producto.precio, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</td>
                                <td>
                                    <span th:class="${producto.estado} ? 'badge bg-success' : 'badge bg-secondary'"
                                          th:text="${producto.estado} ? 'Activo' : 'Inactivo'">Activo</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/productos/editar/{id}(id=${producto.id})}"
                                       class="btn btn-warning btn-sm me-2">
                                        <i class="fas fa-edit"></i> Editar
                                    </a>
                                    <a th:href="@{/productos/eliminar/{id}(id=${producto.id})}"
                                       class="btn btn-danger btn-sm">
                                        <i class="fas fa-trash"></i> Eliminar
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </th:block>

    <div class="modal fade" id="productoModal" tabindex="-1" aria-labelledby="productoModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-bottom-0">
                    <h5 class="modal-title fw-bold" id="productoModalLabel" th:text="${editando} ? 'Editar producto' : 'Crear producto'">
                        Crear producto
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form th:action="@{/productos/guardar}" th:object="${producto}" method="POST">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3 row align-items-center">
                            <label class="col-sm-3 col-form-label">Categoría:</label>
                            <div class="col-sm-9">
                                <select name="categoria" th:field="*{categoria}" class="form-select border-light bg-light">
                                    <option value="Pollo">Pollo</option>
                                    <option value="Papas">Papas</option>
                                    <option value="Bebidas">Bebidas</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3 row align-items-center">
                            <label class="col-sm-3 col-form-label">Nombre:</label>
                            <div class="col-sm-9">
                                <input type="text" th:field="*{nombre}" class="form-control border-light bg-light" required>
                            </div>
                        </div>

                        <div class="mb-3 row align-items-center">
                            <label class="col-sm-3 col-form-label">Precio:</label>
                            <div class="col-sm-9">
                                <input type="number" step="0.01" min="0.01" th:field="*{precio}" class="form-control border-light bg-light" required>
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" th:field="*{estado}">
                            <label class="form-check-label text-muted">Activo</label>
                        </div>

                        <div class="modal-footer border-top-0 px-0">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary" th:text="${editando} ? 'Actualizar Producto' : 'Guardar Producto'">Guardar Producto</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="extra-js">
        <script th:if="${editando}">
            const productoModal = new bootstrap.Modal(document.getElementById('productoModal'));
            productoModal.show();
        </script>
    </th:block>
</body>
</html>
