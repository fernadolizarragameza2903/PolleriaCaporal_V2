<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Detalles de Usuario - Pollería Caporal</title>
</head>
<body>
    <th:block layout:fragment="content">
        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4>
                            <i class="fas fa-user-circle"></i> Detalles del Usuario
                        </h4>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <h6 class="text-muted">Usuario</h6>
                                <p class="fs-5" th:text="${usuario.username}"></p>
                            </div>
                            <div class="col-md-6">
                                <h6 class="text-muted">Nombre Completo</h6>
                                <p class="fs-5" th:text="${usuario.nombreCompleto}"></p>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <h6 class="text-muted">Email</h6>
                                <p th:text="${usuario.email} ?: '-'"></p>
                            </div>
                            <div class="col-md-6">
                                <h6 class="text-muted">Teléfono</h6>
                                <p th:text="${usuario.telefono} ?: '-'"></p>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <h6 class="text-muted">Rol</h6>
                                <p>
                                    <span th:if="${usuario.rol.name() == 'ROLE_ADMIN'}" 
                                          class="badge bg-danger">
                                        <i class="fas fa-star"></i> Administrador
                                    </span>
                                    <span th:if="${usuario.rol.name() == 'ROLE_EMPLOYEE'}" 
                                          class="badge bg-info">
                                        <i class="fas fa-user-tie"></i> Empleado
                                    </span>
                                </p>
                            </div>
                            <div class="col-md-6">
                                <h6 class="text-muted">Estado</h6>
                                <p>
                                    <span th:if="${usuario.estado}" class="badge bg-success">
                                        <i class="fas fa-check-circle"></i> Activo
                                    </span>
                                    <span th:unless="${usuario.estado}" class="badge bg-secondary">
                                        <i class="fas fa-times-circle"></i> Inactivo
                                    </span>
                                </p>
                            </div>
                        </div>

                        <hr>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <h6 class="text-muted">Fecha de Creación</h6>
                                <p th:text="${usuario.fechaCreacion}"></p>
                            </div>
                            <div class="col-md-6">
                                <h6 class="text-muted">Última Actualización</h6>
                                <p th:text="${usuario.fechaActualizacion}"></p>
                            </div>
                        </div>

                        <!-- Botones de acción -->
                        <div class="d-flex gap-2 mt-4">
                            <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}" 
                               class="btn btn-warning">
                                <i class="fas fa-edit"></i> Editar
                            </a>
                            <form method="post" 
                                  th:action="@{/usuarios/{id}/eliminar(id=${usuario.id})}"
                                  style="display:inline;" 
                                  onsubmit="return confirm('¿Está seguro de que desea eliminar este usuario?');">
                                <button type="submit" class="btn btn-danger">
                                    <i class="fas fa-trash"></i> Eliminar
                                </button>
                            </form>
                            <a href="/usuarios" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Volver
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Información adicional -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5>Estadísticas</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <h6 class="text-muted">Total de Pedidos</h6>
                            <p class="fs-4 text-primary" th:text="${usuario.pedidos.size()}">0</p>
                        </div>
                        <div class="mb-3">
                            <h6 class="text-muted">Monto Total Vendido</h6>
                            <p class="fs-4 text-success">$0.00</p>
                        </div>
                        <div class="mb-3">
                            <h6 class="text-muted">Venta Promedio</h6>
                            <p class="fs-4 text-info">$0.00</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
