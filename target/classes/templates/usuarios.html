<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Gestión de Usuarios - Pollería Caporal</title>
</head>
<body>
    <th:block layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>
                <i class="fas fa-users"></i> Gestión de Usuarios
            </h2>
            <a href="/usuarios/nuevo" class="btn btn-primary">
                <i class="fas fa-plus"></i> Nuevo Usuario
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover table-striped">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Usuario</th>
                                <th>Nombre Completo</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="usuario : ${usuarios}">
                                <td th:text="${usuario.id}"></td>
                                <td th:text="${usuario.username}"></td>
                                <td th:text="${usuario.nombreCompleto}"></td>
                                <td th:text="${usuario.email}"></td>
                                <td>
                                    <span th:if="${usuario.rol != null and usuario.rol.name() == 'ROLE_ADMIN'}"
                                          class="badge bg-danger">
                                        <i class="fas fa-star"></i> Administrador
                                    </span>
                                    <span th:if="${usuario.rol != null and usuario.rol.name() == 'ROLE_EMPLOYEE'}"
                                          class="badge bg-info">
                                        <i class="fas fa-user-tie"></i> Empleado
                                    </span>
                                </td>
                                <td>
                                    <span th:if="${usuario.estado}" class="badge bg-success">
                                        <i class="fas fa-check-circle"></i> Activo
                                    </span>
                                    <span th:unless="${usuario.estado}" class="badge bg-secondary">
                                        <i class="fas fa-times-circle"></i> Inactivo
                                    </span>
                                </td>
                                <td>
                                    <a th:href="@{/usuarios/{id}(id=${usuario.id})}"
                                       class="btn btn-sm btn-info" title="Ver">
                                        <i class="fas fa-eye"></i>
                                    </a>
                                    <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}"
                                       class="btn btn-sm btn-warning" title="Editar">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <form method="post"
                                          th:action="@{/usuarios/{id}/eliminar(id=${usuario.id})}"
                                          style="display:inline;"
                                          onsubmit="return confirm('¿Está seguro?');">
                                        <button type="submit" class="btn btn-sm btn-danger" title="Eliminar">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${usuarios == null or usuarios.isEmpty()}">
                                <td colspan="7" class="text-center text-muted py-4">
                                    <i class="fas fa-inbox"></i> No hay usuarios registrados
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
