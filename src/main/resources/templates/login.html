<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pollería Caporal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #d84315;
            --secondary-color: #f57c00;
        }

        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }

        .login-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .login-image {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 60px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .login-image i {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .login-image h2 {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .login-image p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .login-form {
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-form h3 {
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            color: #424242;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(216, 67, 21, 0.15);
        }

        .btn-login {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .btn-login:hover {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
            color: white;
        }

        .alert {
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .login-content {
                grid-template-columns: 1fr;
            }

            .login-image {
                display: none;
            }

            .login-form {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-content">
            <!-- Sección de imagen -->
            <div class="login-image">
                <i class="fas fa-drumstick-bite"></i>
                <h2>Pollería Caporal</h2>
                <p>Sistema de Gestión de Ventas</p>
                <p style="margin-top: 30px; font-size: 0.9rem;">
                    Ingresa con tus credenciales para acceder al sistema
                </p>
            </div>

            <!-- Sección de formulario -->
            <div class="login-form">
                <h3><i class="fas fa-sign-in-alt"></i> Ingresar</h3>

                <!-- Mensaje de error -->
                <div th:if="${param.error}" class="alert alert-danger" role="alert">
                    <i class="fas fa-exclamation-circle"></i>
                    Usuario o contraseña inválidos
                </div>

                <!-- Mensaje de logout -->
                <div th:if="${param.logout}" class="alert alert-info" role="alert">
                    <i class="fas fa-check-circle"></i>
                    Has cerrado sesión correctamente
                </div>

                <!-- Formulario de login -->
                <form method="post" th:action="@{/login}">
                    <div class="form-group">
                        <label for="username">
                            <i class="fas fa-user"></i> Usuario
                        </label>
                        <input type="text" class="form-control" id="username" name="username" 
                               placeholder="Nombre de usuario" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-lock"></i> Contraseña
                        </label>
                        <input type="password" class="form-control" id="password" name="password" 
                               placeholder="Contraseña" required>
                    </div>

                    <button type="submit" class="btn btn-login">
                        <i class="fas fa-sign-in-alt"></i> Ingresar
                    </button>
                </form>

                <div style="text-align: center; margin-top: 20px; color: #616161; font-size: 0.95rem;">
                    <i class="fas fa-users"></i> Acceso exclusivo para personal autorizado
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
