<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Nuevo Pedido - Pollería Caporal</title>
</head>
<body>
    <th:block layout:fragment="content">
        <h2 class="mb-4">
            <i class="fas fa-plus-circle"></i> Registrar Nuevo Pedido
        </h2>

        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <form method="post" action="#" id="formPedido">
                            <!-- Datos del Cliente -->
                            <fieldset class="mb-4">
                                <legend class="fs-5 mb-3">
                                    <i class="fas fa-user"></i> Datos del Cliente
                                </legend>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="clienteNombre" class="form-label">Nombre del Cliente *</label>
                                            <input type="text" class="form-control" id="clienteNombre" 
                                                   name="clienteNombre" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label for="clienteTelefono" class="form-label">Teléfono</label>
                                            <input type="tel" class="form-control" id="clienteTelefono" 
                                                   name="clienteTelefono">
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="clienteDireccion" class="form-label">Dirección de Entrega</label>
                                    <textarea class="form-control" id="clienteDireccion" 
                                              name="clienteDireccion" rows="2"></textarea>
                                </div>
                            </fieldset>

                            <!-- Productos del Pedido -->
                            <fieldset class="mb-4">
                                <legend class="fs-5 mb-3">
                                    <i class="fas fa-box"></i> Productos
                                </legend>
                                <table class="table" id="tablaProductos">
                                    <thead>
                                        <tr>
                                            <th>Producto</th>
                                            <th>Precio</th>
                                            <th>Cantidad</th>
                                            <th>Subtotal</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody id="cuerpoProductos">
                                        <!-- Se agregará dinámicamente -->
                                    </tbody>
                                </table>
                                <button type="button" class="btn btn-sm btn-info" id="btnAgregarProducto">
                                    <i class="fas fa-plus"></i> Agregar Producto
                                </button>
                            </fieldset>

                            <!-- Notas -->
                            <div class="mb-3">
                                <label for="nota" class="form-label">Notas Especiales</label>
                                <textarea class="form-control" id="nota" name="nota" rows="3" 
                                          placeholder="Ej: Sin ají, extra salsa..."></textarea>
                            </div>

                            <!-- Botones -->
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> Guardar Pedido
                                </button>
                                <a href="/empleados/dashboard" class="btn btn-secondary">
                                    <i class="fas fa-times"></i> Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Resumen -->
            <div class="col-md-4">
                <div class="card sticky-top">
                    <div class="card-header">
                        <h5>Resumen del Pedido</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-3">
                            <span>Subtotal:</span>
                            <strong id="subtotal">$0.00</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span>Impuesto (18%):</span>
                            <strong id="impuesto">$0.00</strong>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between" style="font-size: 1.2rem;">
                            <span>Total:</span>
                            <strong id="total" style="color: var(--primary-color);">$0.00</strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </th:block>

    <th:block layout:fragment="extra-js">
        <script>
            document.getElementById('btnAgregarProducto').addEventListener('click', function() {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>
                        <select class="form-control form-control-sm producto-select" required>
                            <option value="">-- Seleccionar --</option>
                            <option value="1">Polla a la Brasa</option>
                            <option value="2">Menú Familiar</option>
                        </select>
                    </td>
                    <td><input type="number" class="form-control form-control-sm precio" readonly></td>
                    <td><input type="number" class="form-control form-control-sm cantidad" value="1" min="1"></td>
                    <td><input type="number" class="form-control form-control-sm subtotal" readonly></td>
                    <td>
                        <button type="button" class="btn btn-sm btn-danger btn-eliminar">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                document.getElementById('cuerpoProductos').appendChild(fila);
                
                fila.querySelector('.btn-eliminar').addEventListener('click', function() {
                    fila.remove();
                });
            });
        </script>
    </th:block>
</body>
</html>
