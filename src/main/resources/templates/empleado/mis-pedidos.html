<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Mis Pedidos - Pollería Caporal</title>
</head>
<body>
    <th:block layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>
                <i class="fas fa-list"></i> Mis Pedidos
            </h2>
            <a href="/empleados/pedidos/nuevo" class="btn btn-primary">
                <i class="fas fa-plus"></i> Nuevo Pedido
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover table-striped">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>Teléfono</th>
                                <th>Fecha</th>
                                <th>Total</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${pedidos != null and pedidos.size() > 0}" th:each="pedido : ${pedidos}">
                                <td th:text="${pedido.id}">1</td>
                                <td th:text="${pedido.clienteNombre}">Cliente</td>
                                <td th:text="${pedido.clienteTelefono}">999999999</td>
                                <td th:text="${#temporals.format(pedido.fechaPedido, 'dd/MM/yyyy HH:mm')}">10/05/2025 14:30</td>
                                <td th:text="'S/ ' + ${#numbers.formatDecimal(pedido.total, 1, 2)}">S/ 0.00</td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${pedido.estado.name() == 'PENDIENTE' ? 'bg-warning' : pedido.estado.name() == 'PAGADO' ? 'bg-success' : 'bg-danger'}"
                                          th:text="${pedido.estado.name()}">PENDIENTE</span>
                                </td>
                                <td>
                                    <a href="#" class="btn btn-sm btn-info" th:href="@{/empleados/pedidos/{id}(id=${pedido.id})}">
                                        <i class="fas fa-eye"></i> Ver
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${pedidos == null or pedidos.size() == 0}">
                                <td colspan="7" class="text-center text-muted py-4">
                                    <i class="fas fa-inbox"></i> No hay pedidos registrados
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
