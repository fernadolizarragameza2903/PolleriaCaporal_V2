<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Reportes - Pollería Caporal</title>
</head>
<body>
    <th:block layout:fragment="content">
        <h2 class="mb-4">
            <i class="fas fa-chart-bar"></i> Reportes de Ventas
        </h2>

        <!-- Filtros -->
        <div class="card mb-4">
            <div class="card-body">
                <form method="get" class="row g-3">
                    <div class="col-md-3">
                        <label for="fechaInicio" class="form-label">Fecha Inicio</label>
                        <input type="date" class="form-control" id="fechaInicio" name="fechaInicio">
                    </div>
                    <div class="col-md-3">
                        <label for="fechaFin" class="form-label">Fecha Fin</label>
                        <input type="date" class="form-control" id="fechaFin" name="fechaFin">
                    </div>
                    <div class="col-md-3">
                        <label for="empleado" class="form-label">Empleado</label>
                        <select class="form-control" id="empleado" name="empleado">
                            <option value="">-- Todos --</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-filter"></i> Filtrar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Estadísticas -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="text-muted">Total Ventas</h5>
                        <h3 class="text-primary" th:text="${totalVentas}">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="text-muted">Monto Total</h5>
                        <h3 class="text-success" th:text="'S/ ' + ${#numbers.formatDecimal(montoTotal,1,2)}">S/ 0.00</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="text-muted">Venta Promedio</h5>
                        <h3 class="text-info" th:text="'S/ ' + ${#numbers.formatDecimal(ventaPromedio,1,2)}">S/ 0.00</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="text-muted">Mejor Vendedor</h5>
                        <h3 class="text-warning">-</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla de reportes -->
        <div class="card">
            <div class="card-header">
                <h5>Detalle de Ventas</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Fecha</th>
                                <th>Empleado</th>
                                <th>Cliente</th>
                                <th>Entrega</th>
                                <th>Total</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(pedidos)}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    <i class="fas fa-inbox"></i> No hay reportes disponibles
                                </td>
                            </tr>
                            <tr th:each="pedido : ${pedidos}">
                                <td>
                                    <span class="badge bg-light text-dark" th:text="${#temporals.format(pedido.fechaPedido, 'dd/MM/yyyy HH:mm')}">01/01/2024</span>
                                </td>
                                <td th:text="${pedido.usuario.username}">Empleado</td>
                                <td th:text="${pedido.clienteNombre}">Cliente</td>
                                <td th:text="${pedido.clienteDireccion}">Entrega</td>
                                <td>
                                    <strong th:text="'S/ ' + ${#numbers.formatDecimal(pedido.total,1,2)}">S/ 0.00</strong>
                                </td>
                                <td>
                                    <span class="badge bg-success">Completado</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Botones de acción -->
        <div class="mt-4">
            <button class="btn btn-success" onclick="exportarPDF()">
                <i class="fas fa-file-pdf"></i> Exportar PDF
            </button>
            <button class="btn btn-info" onclick="exportarExcel()">
                <i class="fas fa-file-excel"></i> Exportar Excel
            </button>
        </div>
    </th:block>

    <th:block layout:fragment="extra-js">
        <script>
            function exportarPDF() {
                alert('Función de exportación PDF en desarrollo');
            }
            
            function exportarExcel() {
                alert('Función de exportación Excel en desarrollo');
            }
        </script>
    </th:block>
</body>
</html>
