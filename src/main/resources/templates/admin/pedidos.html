<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
    <title>Todos los Pedidos - Pollería Caporal</title>
</head>
<body>
    <th:block layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>
                <i class="fas fa-list"></i> Todos los Pedidos
            </h2>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover table-striped">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>Teléfono</th>
                                <th>Fecha</th>
                                <th>Total</th>
                                <th>Estado</th>
                                <th>Usuario</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(pedidos)}">
                                <td colspan="8" class="text-center text-muted py-4">
                                    <i class="fas fa-inbox"></i> No hay pedidos registrados
                                </td>
                            </tr>
                            <tr th:each="pedido : ${pedidos}">
                                <td th:text="${pedido.id}"></td>
                                <td th:text="${pedido.clienteNombre}"></td>
                                <td th:text="${pedido.clienteTelefono}"></td>
                                <td th:text="${#temporals.format(pedido.fechaPedido, 'dd/MM/yyyy HH:mm')}"></td>
                                <td th:text="'S/ ' + ${#numbers.formatDecimal(pedido.total,1,2)}"></td>
                                <td>
                                    <span th:class="${pedido.estado.name() == 'PENDIENTE'} ? 'badge bg-warning' : 
                                                     ${pedido.estado.name() == 'COMPLETADO'} ? 'badge bg-success' : 'badge bg-secondary'"
                                          th:text="${pedido.estado.name()}"></span>
                                </td>
                                <td th:text="${pedido.usuario.username}"></td>
                                <td>
                                    <button class="btn btn-sm btn-info" title="Ver detalles">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
